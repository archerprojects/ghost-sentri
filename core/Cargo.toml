# core/Cargo.toml — v1.1.0 — Thursday 12 November 2026
# ghost-sentri-core — shared, toolkit-free foundation crate.

[package]
name = "ghost-sentri-core"
version = "1.0.0"
edition = "2021"
description = "Shared config, scan, protocol, and audit types for Ghost Sentri."
license = "GPL-3.0-only"

[lib]
name = "ghost_sentri_core"
path = "src/lib.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
dirs       = "5"
chrono     = { version = "0.4", features = ["serde", "clock"] }
regex      = "1"
log        = "0.4"
