# gui/Cargo.toml — v1.1.0 — Thursday 12 November 2026
# ghost-sentri (user-facing binary): on-demand dashboard + installer UI.
# Links GTK4/libadwaita via relm4. NOT resident — launched on demand, exits on close.
# No ksni (tray moved to daemon), no zbus, no backend deps.

[package]
name = "ghost-sentri-gui"
version = "1.1.0"
edition = "2021"
description = "Ghost Sentri dashboard and installer UI."
license = "GPL-3.0-only"

# User-facing command is `ghost-sentri`.
[[bin]]
name = "ghost-sentri"
path = "src/main.rs"

[dependencies]
ghost-sentri-core = { path = "../core" }

relm4      = { version = "0.9", features = ["libadwaita"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk        = { package = "gtk4", version = "0.9", features = ["v4_10"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
chrono     = { version = "0.4", features = ["clock"] }
serde_json = "1"
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"
dirs       = "5"
